<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan Husaini &amp; Diah</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Modal Undangan -->
  <div id="invitationModal" class="invitation-modal">
    <div class="modal-content">
      <div class="modal-card">
        <h1 class="modal-title">Undangan Spesial</h1>
        <p class="modal-subtitle">Anda mendapatkan undangan eksklusif dari kami</p>
        <div class="modal-hearts">💕 💕 💕</div>
        <p class="modal-text">Klik tombol di bawah untuk membuka undangan</p>
        <button class="btn-open-invitation" onclick="openInvitation()">
          <i class="fas fa-heart"></i> Buka Undangan <i class="fas fa-heart"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Open invitation function
    function openInvitation() {
      // Redirect ke index.html setelah klik button
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
